name: Build and Release

on:
  push:
    # main 上的提交也要测：squash 合并后的真实提交、直接推到 main 的提交，
    # 以前都要等打 tag 才第一次被测，那时 tag 已经公开，只能删掉重打。
    branches:
      - main
    tags:
      - 'v*'
      - 'beta*'
  pull_request:
  workflow_dispatch:

# 默认只读。只有最后的 release job 需要写权限（创建 Release、上传附件），在那里单独声明。
# 以前顶层就是 contents: write：PR 和 tag 构建里执行 npm ci / electron-builder 全部依赖代码的
# job 也拿着可写 token，而 checkout 默认还会把它留在 .git/config 里。
permissions:
  contents: read

# 同一个 PR 连推几次时取消旧的运行。main 上的提交和 tag 发布都不取消：
# main 上每个提交都要有完整的测试与安装包结果，tag 半途取消会留下残缺的 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 第三方 action 一律固定到提交 SHA（行尾注释是对应版本），tag 可以被改指向；
# 升级由 .github/dependabot.yml 提 PR。
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # 打 tag 时最先核对：标签等于 internal/version/VERSION，CHANGELOG 里有这一节、
      # 且正文没有候选版字样。几秒内就报清楚，而不是等全部构建跑完、
      # 到上传附件时才因为文件名对不上失败。
      - name: 发布前置检查（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # 不在 run: 里直接插值 ${{ }}，避免标签名成为脚本注入面
          TAG: ${{ github.ref_name }}
        run: python desktop/release_notes.py "$TAG" --release -o "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 同步桌面资源
        run: python desktop/sync-assets.py
      # 自动发现 desktop/check-*.mjs、desktop/electron/check-*.mjs 与 desktop/check_*.py，
      # 新增检查不用再改这里（以前手抄的清单和 README / CONTRIBUTING 已经对不上）。
      - name: 前端、Electron 与发布脚本回归
        run: node desktop/run-checks.mjs
      # go.mod / go.sum 必须已经 tidy：没用到的依赖（曾挂着 tailscale 预发布版）有差异就失败。
      # 放在 Linux 上跑，检出是 LF，不会因为行尾误报。
      - name: 依赖清单整洁（go mod tidy -diff）
        run: go mod tidy -diff
      - name: 静态检查
        run: go vet ./...
      # 实验 VPN 代码只在 campusvpn 标签下编译；不在这里编一次，它坏了也没人知道。
      - name: 静态检查（-tags campusvpn）
        run: go vet -tags campusvpn ./...
      # 本地 HTTP 服务里有多处共享状态，-race 让数据竞争在 CI 里现形。
      - name: 单元测试（-race）
        run: go test -race ./...
      # vpn_test.go 只在 campusvpn 标签下编译：残留系统代理的善后、断开与 busy 复位都靠它守着。
      - name: 桌面服务单元测试（-tags campusvpn）
        run: go test -tags campusvpn ./desktop/internal/ui/

  # F25：darwin 此前只被交叉编译、从不执行，而 szunet-darwin-* 是随发布分发的。
  # 这个 job 在 macOS 上真跑一遍凭据相关的代码，并已进入 release 的 needs——
  # 它第一次运行就抓出了 F26（security 要求输入两遍，导致 macOS 存不了凭据）。
  # 有了 macOS 桌面版以后，它在 macOS 上跑全套检查：run-checks（check-main-wiring 在 darwin 宿主上实跑）、
  # go vet 与 go test ./...（校历 Vision、飞书兜底查找、信号退出、钥匙串信封这些 darwin 专属测试只在这里执行）。
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # 必须先同步资源：desktop/internal/ui/assets/ 是生成物、不进仓库，
      # 少了它 go:embed all:assets 会直接失败（beta0.7.2 的 test-macos 就是这么红的）。
      - name: 同步桌面资源
        run: python desktop/sync-assets.py
      # 与 test job 同一个入口。macOS 专属的检查（check-macos-*、check-packaging-macos）在别的宿主上
      # 只能模拟平台，这里才是真的 darwin。
      - name: macOS 上的回归
        run: node desktop/run-checks.mjs
      - name: darwin 静态检查
        run: go vet ./...
      - name: darwin 单元测试
        run: go test ./... -count=1
      # vpn_test.go 只在 campusvpn 标签下编译；darwin 上也编一次、跑一次。
      - name: 桌面服务单元测试（-tags campusvpn）
        run: go test -tags campusvpn ./desktop/internal/ui/

      # F21 / F26 的核心假设：`security add-generic-password -w`（-w 放末尾、不带值）
      # 在打不开 /dev/tty 时会退回读标准输入，而且会**问两遍**（密码 + 确认）。
      # CI 进程本来就没有控制终端，正好复现这个条件。
      #
      # 这一步曾经带 continue-on-error，把真实的失败显示成 success，于是
      # beta0.7.1 / beta0.7.2 带着「macOS 上根本存不了凭据」发出去了（F26）。
      # 现在它必须如实报红，release job 也依赖它（见下面的 needs）。
      - name: 真实 security 命令的 stdin 假设探针
        timeout-minutes: 5
        run: |
          set -e
          sw_vers || true
          ONE=szunet-probe-one
          TWO=szunet-probe-two
          cleanup() {
            security delete-generic-password -a probe -s "$ONE" >/dev/null 2>&1 || true
            security delete-generic-password -a probe -s "$TWO" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # 刻意不建临时钥匙串、也不改搜索列表：生产的 promptWrite / promptRead
          # 都是不带 -k 的，写读都落在默认钥匙串上。上一版探针用
          # `list-keychains -s $KC` 把搜索列表限制到临时钥匙串，而 add 没带 -k
          # 仍写进默认钥匙串，于是 find 必然报 could not be found——那是探针自己的 bug。

          # 只作记录、不作断言：`security -w` 问几遍并不稳定。同一镜像
          # （macos-26-arm64 / macOS 26.6.2）的几次运行里，一次要求确认
          # （只喂一行报 passwords don't match、退出码 44，这就是 F26），
          # 另一次只问一遍就收下了。
          if printf 'v1\n' | security add-generic-password -a probe -s "$ONE" -U -w >/dev/null 2>&1; then
            echo "记录：本次 runner 上只喂一行也能写入（没有要求确认）"
          else
            echo "记录：本次 runner 上只喂一行失败（要求输入两遍确认）——F26 就是这种情况"
          fi

          # 必须成立的是这一条：程序实际采用的「密码 + 确认」两行喂法能写入并读回一致。
          printf 'v2\nv2\n' | security add-generic-password -a probe -s "$TWO" -U -w
          got=$(security find-generic-password -a probe -s "$TWO" -w)
          test "$got" = "v2"
          echo "F21 / F26 成立：无控制终端下 security -w 从标准输入读取，两行喂法可写入并读回一致"

      # 只作记录、不作断言：同样的喂法遇到超过 128 字节的输入时，本机 macOS 26.6.2 实测会静默截成
      # 128 字节、退出码仍为 0。程序在写入前就按 128 字节拦下（internal/credential/keychain_prompt.go），
      # 会话条目里只放 64 位十六进制密钥；这里记下 runner 上的实际行为，系统版本一变就能在日志里看出来。
      - name: 钥匙串长输入探针（只记录）
        timeout-minutes: 5
        run: |
          LONG=szunet-probe-long
          cleanup() {
            security delete-generic-password -a probe -s "$LONG" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          value=$(printf '%0200d' 0)
          if printf '%s\n%s\n' "$value" "$value" | security add-generic-password -a probe -s "$LONG" -U -w >/dev/null 2>&1; then
            got=$(security find-generic-password -a probe -s "$LONG" -w 2>/dev/null | tr -d '\n' | wc -c | tr -d ' ' || true)
            echo "记录：写入 200 字节，读回 ${got:-?} 字节"
            if [ "$got" = 128 ]; then
              echo "记录：被截断到 128 字节，与程序的写入上限一致"
            fi
          else
            echo "记录：200 字节的输入没能写入（退出码非 0）"
          fi

  # 五个平台的命令行版在一台 runner 上交叉编译（与 Makefile 的 cross 目标同一套参数），
  # 每个产物旁边写一份同名 .sha256，和桌面版附件一样可以离线核对。
  build-cli:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: 交叉编译命令行版
        run: make cross
      - name: 生成校验文件
        working-directory: dist
        run: |
          for f in szunet-*; do
            sha256sum "$f" > "$f.sha256"
          done
          cat ./*.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szunet-cli
          path: dist/szunet-*
          if-no-files-found: error

  # Go 引擎只在这里构建一次：整机冒烟、便携包和安装包用的都是同一份字节。
  build-desktop-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 构建 Windows 桌面版（同步资源 + 编译 + 图标与版本信息）
        run: python desktop/build-windows.py
      # 主平台是 Windows：DPAPI 凭据、开机自启登记的参数、实例锁、注册表 MIME 等
      # *_windows.go 和 Windows 专属测试只有在这里才会编译、vet 和运行。
      - name: Windows 静态检查
        run: go vet ./...
      - name: Windows 单元测试
        run: go test ./...
      # 同一套回归在 Windows 上再跑一遍：sidecar 进程树清理（taskkill /T）、系统 VerQueryValueW
      # 读版本资源这类分支只在这里走；vendor 哈希核对也能抓住 Windows 检出变成 CRLF。
      # desktop/electron/check-*.mjs（含 check-sidecar、check-packaging）只用 Node 内置模块，
      # 不需要 npm ci，所以放在这里跑，安装包 job 里不再重复。
      - name: Windows 上的回归
        run: node desktop/run-checks.mjs
      - name: 整机冒烟
        run: python desktop/smoke_windows.py
      - name: 生成发布包
        run: python desktop/make_release.py
      - name: 检查便携包许可文件
        shell: pwsh
        run: |
          $version = (Get-Content internal/version/VERSION -Raw).Trim()
          python desktop/check_licenses.py --portable "dist/szudesktop-$version-windows-amd64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szudesktop-windows-amd64
          path: |
            dist/szudesktop-windows-amd64.exe
            dist/szudesktop-windows-amd64.exe.sha256
            dist/szudesktop-*-windows-amd64.zip
            dist/szudesktop-*-windows-amd64.zip.sha256
          if-no-files-found: error

  # 最终 NSIS 安装包必须在干净 runner 完成已发布旧版升级/重开/卸载才可发布。
  # 本机镜像与缓存设置不进仓库；CI 从官方 npm/GitHub 下载依赖。
  build-desktop-electron-windows:
    needs: build-desktop-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      # electron-builder 打包时下载的 Electron 运行时与 NSIS 等工具（一次一百多 MB）。
      # tag 构建不用缓存：发布用的安装包一律从上游重新下载，不依赖 main 上写下的缓存。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/electron/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      # 不在这里重新编译引擎：安装包里放的必须是上一个 job 通过整机冒烟的那一份。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-windows-amd64
          path: dist
      - name: 核对引擎就是冒烟通过的那一份
        shell: pwsh
        run: |
          $expected = ((Get-Content dist/szudesktop-windows-amd64.exe.sha256 -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash dist/szudesktop-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "下载到的引擎 $actual 与冒烟 job 记录的 $expected 不一致" }
          "SZU_ENGINE_SHA256=$expected" >> $env:GITHUB_ENV
      - name: 装 Electron 依赖
        run: npm ci
        working-directory: desktop/electron
      - name: 打 Windows 安装包（复用已冒烟的引擎）
        run: node build.mjs --skip-sidecar
        working-directory: desktop/electron
      - name: 安装包里的引擎与冒烟通过的一致
        shell: pwsh
        run: |
          $packed = (Get-FileHash desktop/electron/release/win-unpacked/resources/szudesktop-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packed -ne $env:SZU_ENGINE_SHA256) { throw "安装包里的引擎 $packed 不是冒烟通过的 $env:SZU_ENGINE_SHA256" }
      - name: 检查安装包资源中的许可文件
        run: python desktop/check_licenses.py --electron desktop/electron/release/win-unpacked
      # 升级基线是最新公开版（现有用户真正会从它升级），版本与 SHA-256 固定在
      # smoke_installer.py 里；这里按同一处取标签和附件名，不再各写一份。
      - name: 下载固定的公开旧版用于升级验收
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag, $asset = (python desktop/electron/smoke_installer.py --baseline).Trim() -split ' '
          if (-not $tag -or -not $asset) { throw 'smoke_installer.py did not report an upgrade baseline' }
          $baselineDir = Join-Path $env:RUNNER_TEMP 'szu-upgrade-baseline'
          New-Item -ItemType Directory -Path $baselineDir -Force | Out-Null
          gh release download $tag --repo SzuDesktopTeam/szudesktop --pattern $asset --pattern "$asset.sha256" --dir $baselineDir
          if ($LASTEXITCODE -ne 0) { throw 'Published upgrade baseline download failed' }
          "SZU_UPGRADE_INSTALLER=$(Join-Path $baselineDir $asset)" >> $env:GITHUB_ENV
      - name: 跨版本升级与安装版闭环验收（隔离目录与配置）
        run: python desktop/electron/smoke_installer.py
      - name: 保存安装验收证据（不作为发布附件）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-install-smoke-evidence
          path: desktop/electron/release/smoke-evidence/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szudesktop-electron-windows
          path: |
            desktop/electron/release/szuDesktop-Setup-*.exe
            desktop/electron/release/szuDesktop-Setup-*.exe.sha256
          if-no-files-found: error

  # macOS 引擎只在这里构建一次：两个架构各编一份并 ad-hoc 签名（com.szudesktop.engine），
  # arm64 原生、amd64 经 Rosetta 各跑一遍引擎冒烟；DMG 里放的必须是这里冒烟通过的那两份字节。
  build-desktop-macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # amd64 引擎的 --version 自检和冒烟都要在 arm64 runner 上经 Rosetta 执行；镜像通常已装好，没装时补装。
      - name: 确认 Rosetta 可用
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: 构建 macOS 引擎（arm64 与 amd64，ad-hoc 签名）
        run: python desktop/build-macos.py
      - name: 引擎冒烟（arm64，原生）
        run: python desktop/smoke_macos.py --arch arm64
      - name: 引擎冒烟（amd64，经 Rosetta）
        run: python desktop/smoke_macos.py --arch amd64
      # .sha256 里写的是相对仓库根的路径（dist/szudesktop-darwin-<arch>），下游 job 要下载到 dist/ 后在仓库根核对。
      # 裸引擎不是发布附件，只在 job 之间传递。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szudesktop-darwin-engines
          path: |
            dist/szudesktop-darwin-arm64
            dist/szudesktop-darwin-arm64.sha256
            dist/szudesktop-darwin-amd64
            dist/szudesktop-darwin-amd64.sha256
          if-no-files-found: error

  # 按芯片各打一个 DMG（直接用上一个 job 冒烟通过的引擎，不重新编译），再挂载、复制、启动一遍：
  # arm64 原生，x64 经 Rosetta。真 Intel 机器上的那一遍在 smoke-desktop-electron-macos-intel。
  build-desktop-electron-macos:
    needs: build-desktop-macos
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 只做 ad-hoc 签名（identity '-'），不涉及任何证书或密钥。PR 构建里 electron-builder 默认跳过签名，
      # 而没签名的包带隔离属性时在 Apple 芯片上会报「已损坏」；build-mac.mjs 也会给子进程设这个值，这里写明来由。
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      # 与 Windows 安装包 job 相同的考虑：tag 构建不用缓存，发布用的 DMG 一律从上游重新下载 Electron。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/electron/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: 确认 Rosetta 可用
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-darwin-engines
          path: dist
      # artifact 不保留可执行位；签名在文件内部，改权限不影响它。在仓库根核对（.sha256 里是 dist/ 开头的路径）。
      - name: 核对引擎就是冒烟通过的那一份
        run: |
          chmod 0755 dist/szudesktop-darwin-arm64 dist/szudesktop-darwin-amd64
          shasum -a 256 -c dist/szudesktop-darwin-*.sha256
      - name: 装 Electron 依赖
        run: npm ci
        working-directory: desktop/electron
      # 脚本对 hdiutil「Resource busy」这类瞬时失败整轮重打（最多再试 2 次），打完逐项断言签名、引擎位置与版本。
      - name: 打 macOS 安装包（arm64 与 x64 两个 DMG，复用已冒烟的引擎）
        run: node build-mac.mjs --arm64 --x64 --skip-sidecar
        working-directory: desktop/electron
      - name: 安装包里的引擎与冒烟通过的一致
        run: |
          cmp desktop/electron/release/mac-arm64/szuDesktop.app/Contents/MacOS/szudesktop-engine dist/szudesktop-darwin-arm64
          cmp desktop/electron/release/mac/szuDesktop.app/Contents/MacOS/szudesktop-engine dist/szudesktop-darwin-amd64
      - name: 检查 .app 里的许可文件
        run: |
          python desktop/check_licenses.py --electron desktop/electron/release/mac-arm64/szuDesktop.app
          python desktop/check_licenses.py --electron desktop/electron/release/mac/szuDesktop.app
      # quit Apple Event 一步若被系统拒绝（-1743，runner 上没有自动化授权），脚本记为跳过并打印警告，其余照常断言。
      - name: DMG 安装版冒烟（arm64，原生）
        run: python desktop/electron/smoke_dmg.py --arch arm64
      - name: DMG 安装版冒烟（x64，经 Rosetta）
        run: python desktop/electron/smoke_dmg.py --arch x64
      - name: 保存 DMG 冒烟证据（不作为发布附件）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-macos-smoke-evidence
          path: desktop/electron/release/smoke-evidence-mac-*
          if-no-files-found: warn
      # 每个 DMG 一百多 MB：非 tag 构建只留 7 天；tag 构建用仓库默认保留期（0 表示默认）。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: szudesktop-electron-macos
          path: |
            desktop/electron/release/szuDesktop-*-mac-*.dmg
            desktop/electron/release/szuDesktop-*-mac-*.dmg.sha256
          if-no-files-found: error
          retention-days: ${{ !startsWith(github.ref, 'refs/tags/') && 7 || 0 }}

  # Rosetta 会掩盖只在 Intel 上出现的问题，发布前要在真 Intel 机器上跑一遍 x64 包。
  # 这种 runner 排队慢、预计 2027 年 8 月前后下线，所以只在推到 main、打 tag 和手动触发时运行，不卡 PR。
  #
  # DMG 暂不进 release：B1–B9 真机验收（docs/STATUS.md 68.2）全部通过之前不发布带 DMG 的版本，
  # 这三个 macOS job 也就不在 release 的 needs 里，Windows 版照常发布，不必等它们（test-macos 仍在 needs 里）。
  # 验收通过后在同一个 PR 里开启：把 build-desktop-electron-macos 和本 job 加进 release 的 needs，
  # 下载 szudesktop-electron-macos 到 dist，files 里加两个 DMG 及其 .sha256，并把 desktop/release_notes.py 的
  # MAC_SINCE 设成那一版；check_release_notes.py 核对这几处与 STATUS 68.2 一致，缺一处就失败。
  smoke-desktop-electron-macos-intel:
    needs: build-desktop-electron-macos
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # DMG 冒烟按源码里的伙伴名册核对包内阵容，要用 node 读 pet-catalog.mjs。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-darwin-engines
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-electron-macos
          path: desktop/electron/release
      # 必须是真 Intel：Rosetta 下 uname -m 也报 x86_64，所以再看 hw.optional.arm64。
      - name: 确认是 Intel 机器并核对下载的产物
        run: |
          echo "uname -m: $(uname -m)"
          test "$(uname -m)" = x86_64
          test "$(sysctl -in hw.optional.arm64)" != 1
          chmod 0755 dist/szudesktop-darwin-arm64 dist/szudesktop-darwin-amd64
          shasum -a 256 -c dist/szudesktop-darwin-*.sha256
          (cd desktop/electron/release && shasum -a 256 -c szuDesktop-*-mac-*.dmg.sha256)
      - name: 引擎冒烟（amd64，Intel）
        run: python desktop/smoke_macos.py --arch amd64
      - name: DMG 安装版冒烟（x64，Intel）
        run: python desktop/electron/smoke_dmg.py --arch x64
      - name: 保存 Intel 冒烟证据（不作为发布附件）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-macos-intel-smoke-evidence
          path: desktop/electron/release/smoke-evidence-mac-*
          if-no-files-found: warn

  release:
    # test-macos 也在里面：它守着 macOS 凭据这条路。beta0.7.1 / beta0.7.2 之所以
    # 带着「macOS 存不了凭据」发出去，就是因为当时这个 job 失败不阻断发布（F26）。
    needs: [build-cli, build-desktop-windows, build-desktop-electron-windows, test-macos]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 整个 workflow 里只有这里能写仓库。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # 发布说明必须来自 CHANGELOG.md 里对应版本的那一节。抽不到就在这里失败，
      # 附件一个都不会上传——beta0.7 那次只发了一行 compare 链接，就是因为没有这道关卡。
      # --release：标签必须等于 VERSION，正文里也不能再留候选版字样（test job 已先查过一次）。
      - name: 从 CHANGELOG.md 抽取发布说明
        env:
          # 不在 run: 里直接插值 ${{ }}，避免标签名成为脚本注入面
          TAG: ${{ github.ref_name }}
        run: python desktop/release_notes.py "$TAG" --release -o "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-windows-amd64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szudesktop-electron-windows
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: szunet-cli
          path: dist
      - name: 上传前核对全部校验文件
        working-directory: dist
        run: sha256sum --strict -c ./*.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: szuDesktop ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/szuDesktop-Setup-*.exe
            dist/szuDesktop-Setup-*.exe.sha256
            dist/szudesktop-windows-amd64.exe
            dist/szudesktop-windows-amd64.exe.sha256
            dist/szudesktop-${{ github.ref_name }}-windows-amd64.zip
            dist/szudesktop-${{ github.ref_name }}-windows-amd64.zip.sha256
            dist/szunet-windows-amd64.exe
            dist/szunet-windows-amd64.exe.sha256
            dist/szunet-darwin-amd64
            dist/szunet-darwin-amd64.sha256
            dist/szunet-darwin-arm64
            dist/szunet-darwin-arm64.sha256
            dist/szunet-linux-amd64
            dist/szunet-linux-amd64.sha256
            dist/szunet-linux-arm64
            dist/szunet-linux-arm64.sha256
          fail_on_unmatched_files: true
          # 按 action 文档：提供了 body 时，body 在前，自动生成的 compare 链接追加在后
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'beta') }}
