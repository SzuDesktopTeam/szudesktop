<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 宠物窗只跑本地文件：禁网络、禁内联脚本，样式允许（本页自带 <style>）。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'">
<title>szuDesktop 宠物</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; /* 透明窗：html/body 都不能有底色 */
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  :root { --pet-scale: 1; }
  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: calc(4px * var(--pet-scale));
    padding: calc(10px * var(--pet-scale)) calc(12px * var(--pet-scale)) calc(16px * var(--pet-scale));
    box-sizing: border-box;
  }
  #bubble {
    position: relative;
    max-width: calc(232px * var(--pet-scale)); box-sizing: border-box;
    background: #FFFDF6; border: 2px solid #6E1F35; border-radius: 12px;
    padding: max(3px, calc(8px * var(--pet-scale))) max(4px, calc(10px * var(--pet-scale))); font-size: max(10px, calc(13px * var(--pet-scale))); line-height: 1.4; color: #4A1A28;
    box-shadow: 0 4px 10px rgba(74, 26, 40, .28);
    opacity: 0; visibility: hidden; transform: scale(.6); transform-origin: 50% 100%;
    transition: opacity .18s ease, transform .18s ease;
    pointer-events: none; word-break: break-word;
  }
  #bubble::after { /* 气泡小尾巴，指向宠物 */
    content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -5px;
    width: 10px; height: 8px; background: #FFFDF6;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-right: 2px solid #6E1F35;
  }
  #bubble.show { opacity: 1; visibility: visible; transform: scale(1); }
  #bubble-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  @media (max-width: 156px) { #bubble-text { -webkit-line-clamp: 2; } }
  @keyframes bubble-pop { from { transform: scale(.6); } 60% { transform: scale(1.08); } to { transform: scale(1); } }
  #bubble.pop { animation: bubble-pop .28s ease; }
  #pet {
    width: calc(150px * var(--pet-scale)); height: calc(162px * var(--pet-scale)); cursor: pointer;
    image-rendering: pixelated;
    filter: drop-shadow(0 6px 6px rgba(40, 20, 10, .25));
    animation: pet-idle 3200ms ease-in-out infinite;
    touch-action: none;
  }
  #pet.dragging[data-action] { cursor: grabbing; animation: none; }
  #pet:focus-visible { outline: 2px solid #6e1f35; outline-offset: 4px; }
  /* 动作全部由 CSS 播放；kind=once 的动作不写 infinite，播一次即停。
     荔宝暂无部件级分组，blink/yawn 用全身近似，已在设置页与文档中如实标注。 */
  #pet[data-action="idle"]  { animation: pet-idle 3200ms ease-in-out infinite; }
  #pet[data-action="happy"] { animation: pet-happy 1200ms ease-in-out infinite; }
  #pet[data-action="sad"]   { animation: pet-sad 2600ms ease-in-out infinite; }
  #pet[data-action="sleep"] { animation: pet-sleep 3600ms ease-in-out infinite; }
  #pet[data-action="blink"] { animation: pet-blink 260ms steps(1); }
  #pet[data-action="yawn"]  { animation: pet-yawn 900ms ease-in-out; }
  #pet[data-action="walk"]  { animation: pet-walk 1100ms ease-in-out; }
  #pet[data-action="react"] { animation: pet-react 700ms cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pet-idle  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes pet-happy { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-10px) scale(1.04, .96); } 70% { transform: translateY(0) scale(.98, 1.03); } }
  @keyframes pet-sad   { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(3px) rotate(-2deg); } }
  @keyframes pet-sleep { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(2px) scale(1.02, .97); } }
  @keyframes pet-blink { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1px) scale(1.03, .96); } }
  @keyframes pet-yawn  { 0%, 100% { transform: scale(1, 1); } 45% { transform: scale(1.06, .9) translateY(3px); } 70% { transform: scale(.97, 1.05); } }
  @keyframes pet-walk  { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-3px) rotate(-2.5deg); } 75% { transform: translateY(-3px) rotate(2.5deg); } }
  @keyframes pet-react { 0% { transform: scale(1, 1); } 35% { transform: scale(1.12, .88); } 65% { transform: scale(.94, 1.08); } 100% { transform: scale(1, 1); } }
  /* 系统要求减少动态效果时：不做弹出动画，也不做任何动作动画。 */
  @media (prefers-reduced-motion: reduce) {
    #bubble { transition: none; }
    #bubble.pop { animation: none; }
    #pet, #pet[data-action] { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble" role="status" aria-live="polite"><span id="bubble-text"></span></div>
  <svg id="pet" viewBox="0 0 52 56" role="button" tabindex="0" aria-label="打开宠物菜单" aria-haspopup="menu"><title>点击打开菜单 · 拖动换位置 · 滚轮调大小</title><use id="pet-use" href="#libao"></use></svg>
</div>
<!-- pet-render 加载本地共享 pet-art.mjs；宠物窗不依赖 Go 资源请求。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pet-sprites"></defs></svg>
<script type="module" src="./pet-render.mjs"></script>
</body>
</html>
