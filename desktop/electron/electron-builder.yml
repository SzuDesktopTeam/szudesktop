appId: com.szudesktop.app
productName: szuDesktop
directories:
  output: release
  buildResources: build
files:
  - main.mjs
  - sidecar.mjs
  - listen-url.mjs
  - external-url.mjs
  - window-policy.mjs
  - preload.cjs
  - pet-policy.mjs
  - from: ../assets/garden
    to: .
    filter:
      - pet-catalog.mjs
      - pet-art.mjs
      - pet-animation.mjs
      - pet-animation-art.mjs
      - pet-player.mjs
      - pet-dialogue.mjs
  - pet-settings.mjs
  - desktop-settings.mjs
  - focus-notifications.mjs
  - smoke-pet.mjs
  - school-window.mjs
  - school-policy.mjs
  - pet.html
  - pet-render.mjs
  - pet-preload.cjs
  - package.json
extraResources:
  - from: ../assets/garden/engine.mjs
    to: garden-engine.mjs
  - from: ../assets/garden/pet-catalog.mjs
    to: pet-catalog.mjs
  - from: ../assets/garden/pet-dialogue.mjs
    to: pet-dialogue.mjs
  - from: ../assets/garden/puzzle2048.mjs
    to: puzzle2048.mjs
  - from: ../assets/garden/garden-orders.mjs
    to: garden-orders.mjs
  - from: ../assets/garden/garden-loop.mjs
    to: garden-loop.mjs
  - from: ../../dist/szudesktop-windows-amd64.exe
    to: szudesktop-windows-amd64.exe
  # 托盘图标：打包后 main.mjs 从 process.resourcesPath 解析。
  - from: ../assets/szudesktop.ico
    to: szudesktop.ico
  - from: ../../LICENSE
    to: licenses/LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: ../assets/fonts/LICENSE-OFL.txt
    to: licenses/FONT-LICENSE-OFL.txt
  - from: ../assets/garden/licenses/2048-MIT.txt
    to: licenses/2048-MIT.txt
  - from: ../assets/garden/vendor/three/LICENSE.txt
    to: licenses/Three-MIT.txt
  - from: ../assets/garden/vendor/sakura/LICENSE.txt
    to: licenses/Sakura-Crossing-MIT.txt
win:
  target: nsis
  icon: ../assets/szudesktop.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: szuDesktop-Setup-${version}.exe
